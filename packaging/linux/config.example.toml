# /var/lib/musictoolkit/config.toml for a server. Relative paths (database, logs) are relative to this file's folder.
[library]
roots = ["/srv/music/library"]      # the folder the songs are in; more can be added from the app (Settings, Add music folder)

[musicbrainz]
contact = ""                        # your email or a project address: MusicBrainz asks every app to say who is asking

[database]
path = "./data/library.db"          # keep it on the system disk, not on the music drive
# The ratings, favorites, plays and playlists live only in this database. A whole, checked copy of it is made by itself every backup_hours, in /var/lib/musictoolkit/backups
# and in each folder of backup_folders. Put one on the music drive (another device than the database), made first:
#   sudo install -d -o mtk -g music -m 2775 /srv/music/backups
# A folder that is not there (the drive is not mounted) is skipped and said in the log, never made.
backup_hours = 24                   # 0: none by itself (the button in Settings and `mtk backup now` still make one)
backup_keep = 7                     # the newest this many copies are kept in each folder
backup_folders = ["/srv/music/backups"]

[logging]
level = "INFO"
dir = "./logs"

[app]
rescan_on_launch = true             # look for new songs when the server starts (a folder that is not there is skipped, never "all deleted")
auto_update = false                 # the Windows desktop app's updater: not used here

[server]
host = "127.0.0.1"                  # "0.0.0.0" listens for other devices directly; "127.0.0.1" is for a proxy on this machine (Tailscale Serve)
port = 4533
# Every name the devices reach this server by, besides localhost. A request that names anything else is refused.
# For Tailscale add the machine's name from `tailscale status`, for example "musicpi.tail1234.ts.net".
allowed_hosts = ["musicpi.local"]
rescan_hours = 6                    # look for new songs by itself every this many hours (0: only at the start, and when asked)
login_days = 90                     # how long a device that opened the sign-in link stays signed in
# The Tailscale accounts that are signed in without the token, behind `tailscale serve` (see "Sign in with Tailscale" in packaging/linux/README.md).
# Each one can do everything, like the token. Needs host = "127.0.0.1". The sign-in page shows the line to add for the account it sees.
tailscale_logins = []               # for example ["you@example.com"]
