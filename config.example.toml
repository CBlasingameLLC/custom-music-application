[library]
roots = []   # folders of music; add them from the app: Settings > Add music folder
canonical_scheme = "{album_artist}/{album}/{track:02d} - {title}.{ext}"

[musicbrainz]
contact = ""        # your email or project URL — required by MusicBrainz API etiquette
app_name = "custom-music-application"

[listenbrainz]
enabled = true
username = ""         # your ListenBrainz username (used to fetch recommendations)
user_token = ""       # from listenbrainz.org/profile/ (used to submit/backfill listens)
scrobble = true       # send plays from the in-app player to ListenBrainz (needs the token above)
now_playing = false   # also show what is playing right now (never kept as a listen)

[lastfm]
enabled = false       # secondary/optional — ListenBrainz is primary
api_key = ""
api_secret = ""

[sync]
device_scheme = "{album_artist}/{album}/{track:02d} - {title}.{ext}"

[database]
path = "./data/library.db"   # relative paths resolve against this file's folder, not the working directory

[logging]
level = "INFO"
dir = "./logs"

[disc]
rip_format = "flac"          # flac | mp3
rip_mp3_quality = "256"      # kbps, constant: 320 | 256 | 192 | 128
rip_accuracy = "verified"    # verified: read twice and compare, read again what differs | fast: read once
rip_root = ""                # the library folder rips go into (empty: the first one)
rip_scheme = ""              # the folder layout of ripped songs (empty: the library's)
rip_cover = true             # fetch the album's front cover from the Cover Art Archive
eject_after_rip = true       # take the disc out when a rip finished without trouble
