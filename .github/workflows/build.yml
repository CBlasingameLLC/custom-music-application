name: Build

# Pull requests and branch pushes build and test everything but publish nothing.
# A push to main publishes a release only when the version in
# src/musictoolkit/__init__.py has no v<version> tag yet, so merging a version
# bump (scripts/bump_version.py) is what ships a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_exists: ${{ steps.tag.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every version number agrees
        id: check
        run: python3 scripts/check_version.py

      - name: Does this version already have a release tag?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.check.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  # The interface in a real Chromium: clicks, keyboard, audio element, drag and drop.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e ".[dev,e2e]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python -m pytest tests/e2e -q

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,packaging]"

      - name: Build backend executable
        run: .venv\Scripts\pyinstaller.exe packaging\mtk_backend.spec

      - name: Smoke-test frozen backend
        run: dist\mtk-backend.exe --help

      # --help never touches the database or the web server. This launches the
      # real frozen exe the way a freshly installed app starts: empty user
      # profile, unrelated working directory, no config, no database. It then
      # checks the UI files, token gate, scan, cover art, streaming and backup.
      - name: Smoke-test frozen backend (first run, scan, art, streaming)
        run: python scripts\smoke_frozen.py dist\mtk-backend.exe tests\fixtures

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Stage backend into desktop resources
        run: |
          New-Item -ItemType Directory -Force -Path desktop\resources | Out-Null
          Copy-Item dist\mtk-backend.exe desktop\resources\mtk-backend.exe

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Test the desktop shell's update logic
        working-directory: desktop
        run: npm test

      - name: Build installer
        working-directory: desktop
        run: npm run package

      # The installed app finds new versions through latest.yml (name, size and checksum of the
      # installer) and downloads only the changed blocks using the .blockmap. Both ship with every
      # release; if either is missing or disagrees with the installer, auto-update would silently
      # never work, so fail here instead.
      - name: Check the update files electron-builder wrote
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $dir = 'desktop\release'
          $exe = "MusicToolkit-Setup-$env:VERSION.exe"
          foreach ($name in $exe, "$exe.blockmap", 'latest.yml') {
            if (-not (Test-Path (Join-Path $dir $name))) {
              Get-ChildItem $dir | Out-String | Write-Host
              throw "electron-builder did not write $name"
            }
          }
          $yml = Get-Content (Join-Path $dir 'latest.yml') -Raw
          Write-Host $yml
          if ($yml -notmatch "(?m)^version: $([regex]::Escape($env:VERSION))\s*$") { throw 'latest.yml names another version' }
          if ($yml -notmatch "(?m)^\s*- url: $([regex]::Escape($exe))\s*$") { throw 'latest.yml does not point at the installer' }
          if ($yml -notmatch '(?m)^\s*sha512: \S+') { throw 'latest.yml has no checksum' }
          $size = (Get-Item (Join-Path $dir $exe)).Length
          if ($yml -notmatch "(?m)^\s*size: $size\s*$") { throw "latest.yml lists a different size than the installer ($size bytes)" }

      # The same app, labelled 0.0.1, so a copy of it can be installed and made to update itself to
      # the real build (the `update` job).
      - name: Build an older-versioned installer for the update test
        working-directory: desktop
        run: npm run package -- -c.extraMetadata.version=0.0.1 -c.directories.output=release-old

      # Installs the installer that was just built and drives the installed
      # app's real window: backend start, token handoff, bridge, streaming
      # playback, and that closing the window kills the backend process tree.
      - name: Smoke-test the installed desktop app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop\release\MusicToolkit-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'mtk-install'
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -PassThru
          $setup.WaitForExit()
          Start-Sleep -Seconds 5   # an installer can start the app a moment after it exits
          Get-Process -Name 'Music Toolkit', 'mtk-backend' -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $dir 'Music Toolkit.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem $dir -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw "the installer did not produce $exe (installer exit code $($setup.ExitCode))"
          }
          python -m pip install playwright
          python scripts\smoke_desktop.py --music tests\fixtures --skip-external --expect-updater -- $exe

      - name: Upload installer and update files
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            desktop/release/MusicToolkit-Setup-*.exe
            desktop/release/MusicToolkit-Setup-*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Upload the older-versioned installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-old
          path: desktop/release-old/MusicToolkit-Setup-0.0.1.exe
          if-no-files-found: error

  # An installed old build finds the new release through a local feed, downloads it, restarts into it.
  update:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the new release files
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: new

      - name: Download the old build
        uses: actions/download-artifact@v4
        with:
          name: installer-old
          path: old

      - name: The installed old build updates itself
        shell: pwsh
        run: |
          python -m pip install playwright
          python scripts\smoke_update.py --old (Get-ChildItem old\MusicToolkit-Setup-0.0.1.exe).FullName --feed-dir new --install-dir (Join-Path $env:RUNNER_TEMP 'mtk-update') --expect-version ${{ needs.version.outputs.version }}

  # The previous release, installed and given some data, then upgraded in place by the installer the
  # build job just made. Checks the installer's upgrade path, that the old library database opens and
  # migrates under the new code, and that the upgraded app starts.
  upgrade:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the new installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: new

      - name: Download the previous release
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'mtk-ci' }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" -Headers $headers
          $previous = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -ne "v$env:VERSION" } | Select-Object -First 1
          $asset = if ($previous) { $previous.assets | Where-Object { $_.name -like 'MusicToolkit-Setup-*.exe' } | Select-Object -First 1 }
          if (-not $asset) {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Host 'There is no earlier release with an installer to upgrade from; nothing to check.'
            exit 0
          }
          "found=true" >> $env:GITHUB_OUTPUT
          Write-Host "Upgrading from $($previous.tag_name) ($($asset.name))"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile previous-setup.exe -Headers $headers

      - name: Install the previous release and fill it with data
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mtk-upgrade'
          $setup = Start-Process -FilePath (Resolve-Path previous-setup.exe).Path -ArgumentList '/S', "/D=$dir" -PassThru
          $setup.WaitForExit()
          Start-Sleep -Seconds 5
          Get-Process -Name 'Music Toolkit', 'mtk-backend' -ErrorAction SilentlyContinue | Stop-Process -Force
          $backend = Join-Path $dir 'resources\mtk-backend.exe'
          if (-not (Test-Path $backend)) { throw "the previous installer did not produce $backend (exit code $($setup.ExitCode))" }
          python scripts\upgrade_check.py seed $backend (Join-Path $env:RUNNER_TEMP 'profile') tests\fixtures (Join-Path $env:RUNNER_TEMP 'facts.json')
          if ($LASTEXITCODE -ne 0) { throw 'seeding the previous version failed' }

      - name: Upgrade in place with the new installer
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mtk-upgrade'
          $installer = (Get-ChildItem new\MusicToolkit-Setup-*.exe | Select-Object -First 1).FullName
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -PassThru
          $setup.WaitForExit()
          Start-Sleep -Seconds 5
          Get-Process -Name 'Music Toolkit', 'mtk-backend' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path (Join-Path $dir 'Music Toolkit.exe'))) { throw "the upgrade left no app behind (installer exit code $($setup.ExitCode))" }

      - name: The upgraded install keeps the data
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mtk-upgrade'
          python scripts\upgrade_check.py verify (Join-Path $dir 'resources\mtk-backend.exe') (Join-Path $env:RUNNER_TEMP 'profile') (Join-Path $env:RUNNER_TEMP 'facts.json')
          if ($LASTEXITCODE -ne 0) { throw 'the upgraded install lost or damaged data' }

      - name: The upgraded app starts
        if: steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mtk-upgrade'
          python -m pip install playwright
          python scripts\smoke_desktop.py --music tests\fixtures --skip-external --expect-updater -- (Join-Path $dir 'Music Toolkit.exe')

  release:
    needs: [version, test, e2e, build, upgrade, update]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Publish release v${{ needs.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Music Toolkit ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: installer/*
