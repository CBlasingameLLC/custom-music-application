[project]
name = "musictoolkit"
version = "0.1.0"
description = "Personal music library organizer, importer, recommender, and device sync toolkit"
requires-python = ">=3.11"
dependencies = [
    "mutagen",
    "musicbrainzngs",
    "pylast",
    "pandas",
    "typer",
    "psutil",
    "requests",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
]

[project.scripts]
mtk = "musictoolkit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"musictoolkit.db.migrations" = ["*.sql"]
